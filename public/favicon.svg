<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
  <defs>
    <path id="shieldOuter" d="M 20 18 L 180 18 L 180 108 A 80 82 0 0 1 20 108 Z" />
  </defs>

  <!-- Borde blanco del escudo -->
  <use xlink:href="#shieldOuter" href="#shieldOuter" fill="#FFFFFF" />

  <!-- Cuerpo azul del escudo (inset respecto al borde) -->
  <path d="M 26 24 L 174 24 L 174 106 A 74 76 0 0 1 26 106 Z" fill="#00AAF0" />

  <!-- Línea divisoria blanca entre el encabezado y el cuerpo -->
  <rect x="26" y="70" width="148" height="4" fill="#FFFFFF" />

  <!-- Ícono central: círculo azul marino con recorte tipo "bandera" -->
  <g>
    <circle cx="98" cy="128" r="34" fill="#0013DB" />
    <!-- Notch superior derecho revelando el fondo -->
    <path d="M 98 128 L 98 96 A 34 34 0 0 1 132 128 Z" fill="#00AAF0" />
    <!-- Líneas blancas que perfilan el recorte -->
    <line x1="98" y1="96" x2="98" y2="128" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="98" y1="128" x2="132" y2="128" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>